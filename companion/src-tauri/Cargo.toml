[package]
name = "hidshift-companion"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Desktop manager and switch notification service for HIDShift"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
btleplug = "0.12"
futures-util = "0.3"
hidshift = { path = "../..", features = ["dual-s3-wired"] }
hidshift-client = { path = "../../tools/hidshift-client" }
serde = { version = "1", features = ["derive"] }
serialport = "4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
uuid = "1"
